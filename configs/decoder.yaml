# Stage 3 decoder hyperparameters: Qwen hidden states -> mel spectrogram

# Must match Qwen3-1.7B's hidden_size (see configs/audio_encoder.yaml note).
qwen_hidden_size: 2048

# Mel bins for the predicted spectrogram. Should match whatever mel
# extraction is used on the target (Piper) audio when computing the loss
# (target audio is 22050Hz; see scripts/smoke_test_decoder.py).
n_mels: 80

d_model: 320
num_text_encoder_layers: 4
num_mel_decoder_layers: 4
num_heads: 4
ffn_dim: 1280
dropout: 0.1
